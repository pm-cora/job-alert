<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Alert Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.09);
      padding: 36px 32px;
      width: 100%;
      max-width: 460px;
    }

    h1 { font-size: 21px; font-weight: 700; color: #111; margin-bottom: 4px; }

    .status-line {
      font-size: 13px;
      color: #888;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-active { background: #2ecc71; }
    .dot-paused { background: #e67e22; }
    .dot-loading { background: #bbb; }

    .section { margin-bottom: 28px; }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #aaa;
      margin-bottom: 10px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: #f7f8fa;
      border-radius: 10px;
    }
    .toggle-text { font-size: 15px; color: #222; }
    .toggle-sub { font-size: 12px; color: #aaa; margin-top: 2px; }

    .switch { position: relative; width: 50px; height: 28px; flex-shrink: 0; }
    .switch input { display: none; }
    .slider {
      position: absolute; inset: 0;
      background: #d0d0d0;
      border-radius: 28px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 22px; height: 22px;
      left: 3px; top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    input:checked + .slider { background: #3498db; }
    input:checked + .slider::before { transform: translateX(22px); }

    .recipient-list { list-style: none; margin-bottom: 10px; }
    .recipient-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 7px;
      background: #fafafa;
    }
    .recipient-email { font-size: 14px; color: #333; word-break: break-all; }
    .remove-btn {
      background: none; border: none; color: #ccc;
      cursor: pointer; font-size: 20px; line-height: 1;
      padding: 0 2px; margin-left: 10px; flex-shrink: 0;
      transition: color 0.15s;
    }
    .remove-btn:hover { color: #e74c3c; }

    .chip-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; min-height: 10px; }
    .chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 20px;
      font-size: 13px; font-weight: 500;
    }
    .chip-title { background: #eaf0fb; color: #2c5aa0; }
    .chip-content { background: #eafaf1; color: #1a7a45; }
    .chip-remove {
      background: none; border: none; cursor: pointer;
      font-size: 15px; line-height: 1; padding: 0;
      color: inherit; opacity: 0.5; transition: opacity 0.15s;
    }
    .chip-remove:hover { opacity: 1; }

    .add-row { display: flex; gap: 8px; }
    .add-row input {
      flex: 1; padding: 10px 13px;
      border: 1px solid #e0e0e0; border-radius: 8px;
      font-size: 14px; outline: none;
      transition: border-color 0.15s;
    }
    .add-row input:focus { border-color: #3498db; }
    .btn-add {
      padding: 10px 18px; background: #3498db; color: white;
      border: none; border-radius: 8px; font-size: 14px;
      font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: background 0.15s;
    }
    .btn-add:hover { background: #2980b9; }

    .btn-save {
      width: 100%; padding: 13px; background: #2ecc71; color: white;
      border: none; border-radius: 10px; font-size: 15px;
      font-weight: 700; cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn-save:hover:not(:disabled) { background: #27ae60; }
    .btn-save:disabled { background: #d0d0d0; cursor: default; }

    .footer-link { text-align: center; margin-top: 14px; font-size: 12px; color: #bbb; }
    .footer-link a { color: #3498db; cursor: pointer; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }

    .pat-description { font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.6; }
    .pat-input {
      width: 100%; padding: 11px 13px;
      border: 1px solid #e0e0e0; border-radius: 8px;
      font-size: 14px; font-family: monospace;
      outline: none; margin-bottom: 10px;
      transition: border-color 0.15s;
    }
    .pat-input:focus { border-color: #3498db; }
    .btn-primary {
      width: 100%; padding: 12px; background: #3498db; color: white;
      border: none; border-radius: 8px; font-size: 15px;
      font-weight: 600; cursor: pointer; transition: background 0.15s;
    }
    .btn-primary:hover { background: #2980b9; }
    .pat-hint { margin-top: 14px; font-size: 12px; color: #bbb; line-height: 1.6; }
    .pat-hint a { color: #3498db; text-decoration: none; }
    .pat-hint a:hover { text-decoration: underline; }
    code { background: #f0f2f5; padding: 1px 5px; border-radius: 3px; font-size: 11px; }

    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: #2c3e50; color: white;
      padding: 10px 22px; border-radius: 8px;
      font-size: 14px; opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: #e74c3c; }
    .toast.success { background: #27ae60; }

    #pat-screen  { display: none; }
    #main-screen { display: none; }
  </style>
</head>
<body>

  <div class="card" id="pat-screen">
    <h1>Job Alert Settings</h1>
    <p class="pat-description" style="margin-top:8px;">
      GitHub Personal Access Token이 필요합니다.<br>
      설정을 읽고 저장하는 데만 사용되며, 브라우저에만 저장됩니다.
    </p>
    <input class="pat-input" type="password" id="pat-input"
      placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
    <button class="btn-primary" onclick="savePat()">시작하기</button>
    <p class="pat-hint">
      <code>repo</code> + <code>gist</code> 권한이 필요합니다.<br>
      <a href="https://github.com/settings/tokens/new?description=job-alert-settings&scopes=repo,gist"
         target="_blank">토큰 발급 바로가기</a>
    </p>
  </div>

  <div class="card" id="main-screen">
    <h1>Caroline's Job Alert</h1>
    <div class="status-line" id="status-line">
      <span class="dot dot-loading" id="status-dot"></span>
      <span id="status-text">불러오는 중...</span>
    </div>

    <div class="section">
      <div class="section-label">알림 상태</div>
      <div class="toggle-row">
        <div>
          <div class="toggle-text">매일 알림 발송</div>
          <div class="toggle-sub">매일 오전 8시 Vancouver 기준</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="enabled-toggle" onchange="markDirty()">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="section">
      <div class="section-label">수신자</div>
      <ul class="recipient-list" id="recipient-list"></ul>
      <div class="add-row">
        <input type="email" id="new-email" placeholder="이메일 추가"
          onkeydown="if(event.key==='Enter') addRecipient()">
        <button class="btn-add" onclick="addRecipient()">추가</button>
      </div>
    </div>

    <div class="section">
      <div class="section-label">직무 키워드 <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#bbb;font-size:11px;">검색 및 필터에 사용</span></div>
      <div class="chip-list" id="title-keyword-list"></div>
      <div class="add-row">
        <input type="text" id="new-title-keyword" placeholder="예: product designer"
          onkeydown="if(event.key==='Enter') addKeyword('title')">
        <button class="btn-add" onclick="addKeyword('title')">추가</button>
      </div>
    </div>

    <div class="section">
      <div class="section-label">태그 키워드 <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#bbb;font-size:11px;">공고 본문에서 감지 시 태그 표시</span></div>
      <div class="chip-list" id="content-keyword-list"></div>
      <div class="add-row">
        <input type="text" id="new-content-keyword" placeholder="예: Salesforce"
          onkeydown="if(event.key==='Enter') addKeyword('content')">
        <button class="btn-add" onclick="addKeyword('content')">추가</button>
      </div>
    </div>

    <button class="btn-save" id="save-btn" onclick="saveConfig()" disabled>저장</button>
    <div class="footer-link">
      <a onclick="resetPat()">GitHub 토큰 변경</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const GIST_DESC = 'job-alert config';
    const GIST_FILE = 'config.json';
    let gistId = null;

    const getToken = () => localStorage.getItem('gh_pat') || '';
    const setToken = (t) => localStorage.setItem('gh_pat', t);

    function showScreen(name) {
      document.getElementById('pat-screen').style.display  = name === 'pat'  ? 'block' : 'none';
      document.getElementById('main-screen').style.display = name === 'main' ? 'block' : 'none';
    }

    function showToast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `toast show ${type}`;
      setTimeout(() => el.className = 'toast', 2800);
    }

    function markDirty() {
      document.getElementById('save-btn').disabled = false;
    }

    function toBase64(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }

    /* ── find the job-alert config gist ── */
    async function findGist() {
      let page = 1;
      while (true) {
        const res = await fetch(`https://api.github.com/gists?per_page=100&page=${page}`, {
          headers: { Authorization: `Bearer ${getToken()}`, Accept: 'application/vnd.github+json' },
        });
        if (res.status === 401) { resetPat(); return null; }
        const list = await res.json();
        if (!Array.isArray(list) || list.length === 0) break;
        const found = list.find(g => g.description === GIST_DESC && g.files[GIST_FILE]);
        if (found) return found.id;
        if (list.length < 100) break;
        page++;
      }
      return null;
    }

    async function loadConfig() {
      document.getElementById('status-text').textContent = '불러오는 중...';
      document.getElementById('status-dot').className = 'dot dot-loading';

      try {
        gistId = await findGist();
        if (!gistId) {
          showToast('설정 Gist를 찾을 수 없습니다.', 'error');
          document.getElementById('status-text').textContent = 'Gist를 찾을 수 없음';
          return;
        }

        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          headers: { Authorization: `Bearer ${getToken()}`, Accept: 'application/vnd.github+json' },
        });
        const data = await res.json();
        const config = JSON.parse(data.files[GIST_FILE].content);
        renderConfig(config);
      } catch (e) {
        showToast('설정을 불러오지 못했습니다.', 'error');
      }
    }

    function renderConfig(config) {
      const enabled = config.enabled !== false;
      document.getElementById('enabled-toggle').checked = enabled;
      updateStatusBadge(enabled);
      renderRecipients(config.recipients || []);
      renderKeywords('title', config.title_keywords || []);
      renderKeywords('content', config.content_keywords || []);
      document.getElementById('save-btn').disabled = true;
    }

    function updateStatusBadge(enabled) {
      document.getElementById('status-dot').className = `dot ${enabled ? 'dot-active' : 'dot-paused'}`;
      document.getElementById('status-text').textContent = enabled ? '활성화' : '중단됨';
    }

    function renderRecipients(list) {
      const ul = document.getElementById('recipient-list');
      ul.innerHTML = '';
      list.forEach((email, i) => {
        const li = document.createElement('li');
        li.className = 'recipient-item';
        li.innerHTML = `
          <span class="recipient-email">${escHtml(email)}</span>
          <button class="remove-btn" onclick="removeRecipient(${i})" title="삭제">×</button>
        `;
        ul.appendChild(li);
      });
    }

    function getRecipients() {
      return Array.from(document.querySelectorAll('.recipient-email')).map(el => el.textContent);
    }

    function addRecipient() {
      const input = document.getElementById('new-email');
      const email = input.value.trim();
      if (!email || !email.includes('@')) {
        showToast('올바른 이메일 주소를 입력하세요.', 'error'); return;
      }
      const list = getRecipients();
      if (list.includes(email)) {
        showToast('이미 추가된 이메일입니다.', 'error'); return;
      }
      renderRecipients([...list, email]);
      input.value = '';
      markDirty();
    }

    function removeRecipient(index) {
      const list = getRecipients();
      list.splice(index, 1);
      renderRecipients(list);
      markDirty();
    }

    /* ── keyword chips ── */
    function renderKeywords(type, list) {
      const container = document.getElementById(`${type}-keyword-list`);
      container.innerHTML = '';
      list.forEach((kw, i) => {
        const chip = document.createElement('span');
        chip.className = `chip chip-${type}`;
        chip.innerHTML = `${escHtml(kw)}<button class="chip-remove" onclick="removeKeyword('${type}',${i})" title="삭제">×</button>`;
        container.appendChild(chip);
      });
    }

    function getKeywords(type) {
      return Array.from(document.querySelectorAll(`#${type}-keyword-list .chip`))
        .map(el => el.childNodes[0].textContent.trim());
    }

    function addKeyword(type) {
      const input = document.getElementById(`new-${type}-keyword`);
      const value = input.value.trim();
      if (!value) return;
      const list = getKeywords(type);
      if (list.map(k => k.toLowerCase()).includes(value.toLowerCase())) {
        showToast('이미 있는 키워드입니다.', 'error'); return;
      }
      renderKeywords(type, [...list, value]);
      input.value = '';
      markDirty();
    }

    function removeKeyword(type, index) {
      const list = getKeywords(type);
      list.splice(index, 1);
      renderKeywords(type, list);
      markDirty();
    }

    async function saveConfig() {
      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.textContent = '저장 중...';

      const config = {
        enabled: document.getElementById('enabled-toggle').checked,
        recipients: getRecipients(),
        title_keywords: getKeywords('title'),
        content_keywords: getKeywords('content'),
      };

      try {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          method: 'PATCH',
          headers: {
            Authorization: `Bearer ${getToken()}`,
            'Content-Type': 'application/json',
            Accept: 'application/vnd.github+json',
          },
          body: JSON.stringify({
            files: { [GIST_FILE]: { content: JSON.stringify(config, null, 2) + '\n' } },
          }),
        });
        if (!res.ok) throw new Error((await res.json()).message);
        updateStatusBadge(config.enabled);
        showToast('저장되었습니다.', 'success');
      } catch (e) {
        showToast(`저장 실패: ${e.message}`, 'error');
        btn.disabled = false;
      }

      btn.textContent = '저장';
    }

    function savePat() {
      const token = document.getElementById('pat-input').value.trim();
      if (!token) return;
      setToken(token);
      showScreen('main');
      loadConfig();
    }

    function resetPat() {
      localStorage.removeItem('gh_pat');
      document.getElementById('pat-input').value = '';
      showScreen('pat');
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.getElementById('pat-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') savePat();
    });

    if (getToken()) { showScreen('main'); loadConfig(); }
    else { showScreen('pat'); }
  </script>
</body>
</html>
