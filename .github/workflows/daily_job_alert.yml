name: Daily PM Job Alert

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-job-alert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load config from Gist
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.GIST_TOKEN }}" \
            "https://api.github.com/gists/${{ secrets.CONFIG_GIST_ID }}" | \
            python3 -c "
import sys, json
data = json.load(sys.stdin)
content = data['files']['config.json']['content']
with open('config.json', 'w') as f:
    f.write(content)
print('Config loaded:', content[:80])
"

      - name: Run job alert
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SEARCH_ENGINE_ID: ${{ secrets.SEARCH_ENGINE_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python main.py

      - name: Save seen jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff --cached --quiet || git commit -m "Update seen jobs [skip ci]"
          git pull --rebase origin master
          git push
